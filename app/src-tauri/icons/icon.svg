<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Backdrop: a pane of glass standing in front of a picture. Source for every icon in this folder. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1b21"/><stop offset="1" stop-color="#0e0e12"/></linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb35c"/><stop offset=".5" stop-color="#ff5d77"/><stop offset="1" stop-color="#7656ff"/></linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".34"/><stop offset="1" stop-color="#fff" stop-opacity=".12"/></linearGradient>
    <filter id="frost" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="glass"><rect x="140" y="170" width="300" height="250" rx="44"/></clipPath>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="72" y="92" width="300" height="250" rx="44" fill="url(#back)"/>
  <g clip-path="url(#glass)"><rect x="72" y="92" width="300" height="250" rx="44" fill="url(#back)" filter="url(#frost)"/></g>
  <rect x="140" y="170" width="300" height="250" rx="44" fill="url(#front)"/>
  <rect x="141.5" y="171.5" width="297" height="247" rx="42.5" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="110.5" fill="none" stroke="#fff" stroke-opacity=".07" stroke-width="3"/>
</svg>
