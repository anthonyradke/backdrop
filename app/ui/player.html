<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Backdrop wallpaper</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; cursor: default; }
  .layer { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block;
           opacity: 0; transition: opacity .6s ease; object-fit: cover; background: #000; }
  .layer.on { opacity: 1; }
</style>
</head>
<body>
<script src="player.js"></script>
</body>
</html>
