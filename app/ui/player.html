<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Backdrop wallpaper</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; cursor: default; }
  .layer { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block;
           opacity: 0; transition: opacity .6s ease; object-fit: cover; background: #000; }
  .layer.on { opacity: 1; }
  /* Keeps the menu bar (macOS) or taskbar (Windows) readable over bright wallpapers. */
  #shade { position: fixed; left: 0; right: 0; height: 110px; pointer-events: none; z-index: 2; display: none; }
  #shade.top { display: block; top: 0; background: linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.3) 34px, transparent); }
  #shade.bottom { display: block; bottom: 0; background: linear-gradient(transparent, rgba(0,0,0,.3) 60px, rgba(0,0,0,.55)); }
</style>
</head>
<body>
<div id="shade"></div>
<script src="player.js"></script>
</body>
</html>
