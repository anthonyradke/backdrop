<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Backdrop wallpaper</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; cursor: default; }
  .layer { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block;
           opacity: 0; transition: opacity .6s ease; object-fit: cover; background: #000; }
  .layer.on { opacity: 1; }
  /* Keeps the taskbar readable over bright wallpapers. */
  .shade { position: fixed; height: 110px; pointer-events: none; z-index: 2;
           background: linear-gradient(transparent, rgba(0,0,0,.3) 60px, rgba(0,0,0,.55)); }
</style>
</head>
<body>
<div id="shades"></div>
<script src="scene/tex.js"></script>
<script src="scene/shader.js"></script>
<script src="scene/scene.js"></script>
<script src="scene/text.js"></script>
<script src="scene/particles.js"></script>
<script src="scene/puppet.js"></script>
<script src="scene/script.js"></script>
<script src="player.js"></script>
</body>
</html>
