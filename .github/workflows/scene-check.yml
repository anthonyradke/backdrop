# Runs the scene renderer on Windows, where WebGL goes through Direct3D 11 as it does in WebView2.
# Started by hand: it clones public wallpapers to test with, and none of them stay.
name: scene-check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the browser driver
        shell: pwsh
        run: npm install --prefix ${{ runner.temp }}/pw playwright-core
      - name: Check
        shell: pwsh
        run: node scripts/scene-check/check.mjs --channel msedge --angle d3d11 --modules ${{ runner.temp }}/pw --out ${{ runner.temp }}/out --work ${{ runner.temp }}/work
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scene-check
          path: ${{ runner.temp }}/out
